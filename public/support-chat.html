<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Support</title>
<!--
  Always-open support chat for a POS screen / tablet.
  Open it with the till's site key:

    /support-chat.html?key=SITE_KEY

  Bind that site key to a location in the CRM and the assistant already knows
  which venue it's talking to, so it never asks.
-->
<style>
  html, body { height: 100%; margin: 0; background: #eef1ec; }
  #chat { position: fixed; inset: 0; }
  .setup { font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           color: #16211c; max-width: 480px; margin: 12vh auto; padding: 24px; text-align: center; }
  .setup code { background: #fff; padding: 2px 6px; border-radius: 6px; border: 1px solid #dfe6e2; }
</style>
</head>
<body>
  <div id="chat"></div>
  <script>
    var key = new URLSearchParams(location.search).get('key');
    if (!key) {
      document.getElementById('chat').innerHTML =
        '<div class="setup"><h2>Support chat</h2>' +
        '<p>This screen needs a site key.</p>' +
        '<p>Open it as <code>/support-chat.html?key=YOUR_SITE_KEY</code></p>' +
        '<p>Create the key in the CRM under Settings &rarr; AI Assistant, and bind it to this venue ' +
        'so the assistant already knows the location.</p></div>';
    } else {
      var s = document.createElement('script');
      s.src = 'chat.js';
      s.setAttribute('data-site-key', key);
      s.setAttribute('data-mode', 'inline');
      s.setAttribute('data-target', '#chat');
      s.setAttribute('data-title', new URLSearchParams(location.search).get('title') || 'Support');
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
